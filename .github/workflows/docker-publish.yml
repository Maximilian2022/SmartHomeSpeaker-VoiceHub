name: Build, Push Docker Image & Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

env:
  # Docker Hub 上のリポジトリ名（<ユーザー名>/<IMAGE_NAME> となります）
  # 変更したい場合は以下を書き換えてください。
  IMAGE_NAME: smarthomespeaker-voicehub

jobs:
  test:
    name: Run Unit Tests (Docker)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build local test image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: voicehub-test:local
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Run unit & smoke tests inside container
        run: |
          docker run --rm voicehub-test:local python3 -m unittest discover -s tests -p "test_*.py"

  docker:
    name: Build and Push Docker Image
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up lowercased repository names
        id: prep
        run: |
          # Docker Hub のユーザー名とリポジトリ名を小文字化（大文字混入によるDockerエラーを防止）
          # PR実行時（Dependabot等）はSecretsが注入されないため、既定ユーザー名（madpiero）へ安全にフォールバック
          DOCKER_USER=$(echo "${{ secrets.DOCKERHUB_USERNAME }}" | tr '[:upper:]' '[:lower:]')
          DOCKER_USER=${DOCKER_USER:-madpiero}
          IMAGE_LOWER=$(echo "${{ env.IMAGE_NAME }}" | tr '[:upper:]' '[:lower:]')
          echo "docker_image=${DOCKER_USER}/${IMAGE_LOWER}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: 'arm64'

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        # PRの場合はプッシュしないため、シークレットがない外部PRでも安全にビルドテストのみ走る
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Get app version
        id: app_ver
        run: |
          APP_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('app/version.py').read()); print(m.group(1) if m else '')")
          echo "version=${APP_VER}" >> $GITHUB_OUTPUT

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ steps.prep.outputs.docker_image }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
            type=raw,value=${{ steps.app_ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.app_ver.outputs.version != '' }}
            type=raw,value=v${{ steps.app_ver.outputs.version }},enable=${{ github.ref == 'refs/heads/main' && steps.app_ver.outputs.version != '' }}
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  release:
    name: Create GitHub Release
    needs: [test, docker]
    if: (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine release version tag
        id: tag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            TAG_NAME="${{ github.ref_name }}"
          else
            APP_VER=$(python3 -c "import re; m = re.search(r'__version__\s*=\s*[\"\\\']([^\"\\\']+)[\"\\\']', open('app/version.py').read()); print(m.group(1) if m else '1.0.0')")
            TAG_NAME="v${APP_VER}"
          fi
          echo "tag_name=${TAG_NAME}" >> $GITHUB_OUTPUT

      - name: Generate Japanese release notes
        run: |
          python3 scripts/extract_release_notes.py "${{ steps.tag.outputs.tag_name }}" release_notes.md

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.tag.outputs.tag_name }}
          name: Release ${{ steps.tag.outputs.tag_name }}
          body_path: release_notes.md
          generate_release_notes: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
