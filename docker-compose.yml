services:
  voice-hub:
    image: madpiero/smarthomespeaker-voicehub:latest
    container_name: SmartSpeaker-VoiceHub
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - path: ./.my.env
        required: false
    volumes:
      - voice_data:/app/data
      - voice_cache:/app/public/voice
      - voice_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8080/api/status > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-SmartSpeaker-VoiceHub
    restart: unless-stopped
    network_mode: "host"
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20245 run
    env_file:
      - path: ./.my.env
        required: false
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20245", "ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

volumes:
  voice_data:
    name: smart_speaker_data
  voice_cache:
    name: smart_speaker_cache
  voice_logs:
    name: smart_speaker_logs
