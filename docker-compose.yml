services:
  voice-hub:
    image: madpiero/smarthomespeaker-voicehub:latest
    container_name: SmartSpeaker-VoiceHub
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - path: ./.my.env
        required: false
    volumes:
      - voice_data:/app/data
      - voice_cache:/app/public/voice
      - voice_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "curl -f http://127.0.0.1:8080/health > /dev/null 2>&1 || exit 1" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-SmartSpeaker-VoiceHub
    restart: unless-stopped
    network_mode: "host"
    command: tunnel --no-autoupdate --metrics 127.0.0.1:20245 run
    env_file:
      - path: ./.my.env
        required: false
    healthcheck:
      test: [ "CMD", "cloudflared", "tunnel", "--metrics", "127.0.0.1:20245", "ready" ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    labels:
      - "com.centurylinklabs.watchtower.enable=true"

  # 自動/即時バージョンアップ管理 (Watchtower API待機モード)
  # ※勝手な定期更新は完全無効化 (WATCHTOWER_HTTP_API_PERIODIC_POLLS=false) されており、
  #   WebUI から指示された時、または夜間自動更新がONの時のみ安全に更新を実行します。
  watchtower:
    image: containrrr/watchtower
    container_name: watchtower-VoiceHub
    restart: unless-stopped
    ports:
      - "127.0.0.1:8082:8080"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - WATCHTOWER_HTTP_API_UPDATE=true
      - WATCHTOWER_HTTP_API_TOKEN=voicehub-watchtower-token
      - WATCHTOWER_HTTP_API_PERIODIC_POLLS=false
      - WATCHTOWER_LABEL_ENABLE=true
      - WATCHTOWER_CLEANUP=true

volumes:
  voice_data:
    name: smart_speaker_data
  voice_cache:
    name: smart_speaker_cache
  voice_logs:
    name: smart_speaker_logs
