services:
  google-home-speaker:
    build: .
    container_name: google-home-speaker
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - ./.my.env
    volumes:
      - ./data:/app/data
      - ./public/voice:/app/public/voice
      # ホストの D-Bus / Avahi ソケット（デバイス自動検出用）
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket:ro

  # ========================================================================
  # Cloudflare Tunnel (外部・インターネットからの安全な Webhook 受信口)
  # 使用する際はコメントアウトを解除し、.my.env または環境変数に TUNNEL_TOKEN を設定してください
  # ========================================================================
  # cloudflared:
  #   image: cloudflare/cloudflared:latest
  #   container_name: cloudflared-google-home
  #   restart: unless-stopped
  #   network_mode: "host"
  #   command: tunnel run
  #   environment:
  #     - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
