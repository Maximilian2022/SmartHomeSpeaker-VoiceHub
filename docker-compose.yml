services:
  google-home-speaker:
    build: .
    container_name: google-home-speaker
    restart: unless-stopped
    network_mode: "host"
    env_file:
      - path: ./.my.env
        required: false
    volumes:
      - voice_data:/app/data
      - voice_cache:/app/public/voice
      # ホストの D-Bus / Avahi ソケット（デバイス自動検出用）
      - /run/dbus/system_bus_socket:/run/dbus/system_bus_socket:ro
      - /var/run/avahi-daemon/socket:/var/run/avahi-daemon/socket:ro

  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: cloudflared-google-home
    restart: unless-stopped
    network_mode: "host"
    command: tunnel --no-autoupdate run
    env_file:
      - path: ./.my.env
        required: false

volumes:
  voice_data:
    name: smart_speaker_data
  voice_cache:
    name: smart_speaker_cache


