# ローカル開発者用オーバーライド設定 (Local Development Override)
# このファイルはリポジトリ内で docker compose を実行した際に自動的にマージされ、
# ソースコードのホットリロードとローカルビルドを有効化します。

services:
  voice-hub:
    build: .
    volumes:
      - ./entrypoint.sh:/app/entrypoint.sh
      - ./app:/app/app
      - ./public:/app/public
      - ./tests:/app/tests
      - ./clients:/app/clients

